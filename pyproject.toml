[project]
name = "cas-agent-console"
version = "0.1.0"
description = "CAS read-only local execution console"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["jsonschema>=4.20,<5"]

[project.scripts]
cas-console = "agent_console.server:main"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_console"]

[tool.hatch.build.targets.wheel.force-include]
static = "agent_console/static"
